services:
  postgres:
    image: postgres:16-alpine
    container_name: ali-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ali
      POSTGRES_PASSWORD: ali
      POSTGRES_DB: ali
    volumes:
      - ali_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ali -d ali"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ali_pg_data:
